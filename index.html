<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editable Countdown Timer</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        minimal: {
                            bg: '#121212',
                            card: '#1a1a1a',
                            border: '#2a2a2a',
                            text: '#e5e5e5',
                            muted: '#888888',
                            accent: '#3b82f6'
                        }
                    },
                    fontFamily: {
                        mono: ['Inter', 'monospace'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #121212;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3b82f6;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <!-- Top Navigation Header -->
    <header class="w-full border-b border-[#2a2a2a] bg-[#121212] sticky top-0 z-50 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center space-x-3">
            <div class="w-2.5 h-2.5 bg-blue-500 rounded-full"></div>
            <span class="font-semibold text-sm tracking-wide text-white">CUSTOM COUNTDOWN</span>
        </div>
        <div class="flex items-center space-x-6 text-xs text-[#888888]">
            <div id="current-clock" class="text-blue-400 font-mono">LOCAL --:--:--</div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col items-center justify-center p-6 sm:p-8 z-10 max-w-4xl mx-auto w-full text-center">

        <!-- Target Info & Edit Toggle -->
        <div class="mb-8 w-full max-w-3xl">
            <div class="flex flex-col sm:flex-row items-center justify-between bg-[#1a1a1a] border border-[#2a2a2a] rounded-2xl p-4 gap-4">
                <div class="text-left">
                    <span class="text-xs text-[#888888] uppercase tracking-wider block mb-1">Target Deadline</span>
                    <h1 id="target-date-string" class="text-sm sm:text-base font-medium text-white font-mono">
                        Loading...
                    </h1>
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <button onclick="resetToDefaultSunday()" class="px-3 py-2 bg-[#121212] border border-[#2a2a2a] hover:border-[#444] text-xs text-[#888888] hover:text-white rounded-xl transition-all">
                        Reset Sunday 22:00 GMT+2
                    </button>
                    <button onclick="toggleEditModal(true)" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium rounded-xl transition-all flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                        Edit Target Time
                    </button>
                </div>
            </div>
        </div>

        <!-- Timer Display Matrix -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 sm:gap-6 w-full max-w-3xl mb-12">
            <!-- Days Unit -->
            <div class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-2xl p-6 sm:p-8 flex flex-col items-center justify-center shadow-sm">
                <div id="days" class="font-mono text-5xl sm:text-7xl font-bold text-white tracking-tight mb-2">00</div>
                <div class="text-xs text-[#888888] uppercase tracking-wider font-medium">Days</div>
            </div>

            <!-- Hours Unit -->
            <div class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-2xl p-6 sm:p-8 flex flex-col items-center justify-center shadow-sm">
                <div id="hours" class="font-mono text-5xl sm:text-7xl font-bold text-white tracking-tight mb-2">00</div>
                <div class="text-xs text-[#888888] uppercase tracking-wider font-medium">Hours</div>
            </div>

            <!-- Minutes Unit -->
            <div class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-2xl p-6 sm:p-8 flex flex-col items-center justify-center shadow-sm">
                <div id="minutes" class="font-mono text-5xl sm:text-7xl font-bold text-white tracking-tight mb-2">00</div>
                <div class="text-xs text-[#888888] uppercase tracking-wider font-medium">Minutes</div>
            </div>

            <!-- Seconds Unit -->
            <div class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-2xl p-6 sm:p-8 flex flex-col items-center justify-center shadow-sm">
                <div id="seconds" class="font-mono text-5xl sm:text-7xl font-bold text-blue-400 tracking-tight mb-2">00</div>
                <div class="text-xs text-[#888888] uppercase tracking-wider font-medium">Seconds</div>
            </div>
        </div>

        <!-- Progress Bar Section -->
        <div class="w-full max-w-3xl bg-[#1a1a1a] border border-[#2a2a2a] rounded-2xl p-6 shadow-sm mb-8">
            <div class="flex justify-between items-center mb-3 text-xs text-[#888888]">
                <span>Progress to Target</span>
                <span id="progress-percent" class="text-white font-medium">0.00%</span>
            </div>
            <div class="w-full bg-[#121212] rounded-full h-2.5 overflow-hidden">
                <div id="progress-bar-fill" class="bg-blue-500 h-full rounded-full transition-all duration-300" style="width: 0%;"></div>
            </div>
        </div>

        <!-- Control Actions -->
        <div class="flex flex-wrap items-center justify-center gap-4 w-full max-w-3xl">
            <button onclick="copyCountdownStatus()" class="px-5 py-2.5 bg-[#1a1a1a] border border-[#2a2a2a] hover:border-blue-500 text-white text-xs font-medium rounded-xl transition-all duration-200 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                </svg>
                Copy Status
            </button>
        </div>

    </main>

    <!-- Edit Modal Overlay -->
    <div id="edit-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-200">
        <div class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-semibold text-white tracking-wide">Edit Target Date & Time</h3>
                <button onclick="toggleEditModal(false)" class="text-[#888888] hover:text-white text-sm">✕</button>
            </div>
            <p class="text-xs text-[#888888] mb-4">Select your desired target timestamp below. The countdown will adjust immediately.</p>
            
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-xs text-[#888888] mb-1.5">Target Date & Time (Local Time)</label>
                    <input type="datetime-local" id="modal-datetime-input" class="w-full bg-[#121212] border border-[#2a2a2a] rounded-xl px-4 py-2.5 text-sm text-white font-mono focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <div class="flex justify-end gap-3">
                <button onclick="toggleEditModal(false)" class="px-4 py-2 bg-[#121212] border border-[#2a2a2a] text-xs text-[#888888] hover:text-white rounded-xl">Cancel</button>
                <button onclick="saveNewTarget()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-xs font-medium text-white rounded-xl">Save & Start</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full border-t border-[#2a2a2a] bg-[#121212] py-4 px-6 text-center text-xs text-[#888888]">
        Customizable Countdown Timer Protocol
    </footer>

    <!-- Custom Notification Toast Box -->
    <div id="toast-box" class="fixed bottom-6 right-6 bg-[#1a1a1a] border border-blue-500 text-white px-4 py-3 rounded-xl shadow-lg text-xs opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center gap-2">
        <span class="w-2 h-2 bg-blue-500 rounded-full"></span>
        <span id="toast-message">Status copied to clipboard</span>
    </div>

    <script>
        // Calculate upcoming Sunday at 22:00 GMT+2 as default
        function getDefaultSundayTarget() {
            const now = new Date();
            const utcNow = now.getTime() + (now.getTimezoneOffset() * 60000);
            const gmt2Time = new Date(utcNow + (2 * 3600000));
            
            const dayOfWeek = gmt2Time.getDay();
            let daysUntilSunday = (7 - dayOfWeek) % 7;
            
            const targetGmt2 = new Date(gmt2Time);
            targetGmt2.setDate(gmt2Time.getDate() + daysUntilSunday);
            targetGmt2.setHours(22, 0, 0, 0);
            
            if (dayOfWeek === 0 && gmt2Time.getHours() >= 22) {
                targetGmt2.setDate(targetGmt2.getDate() + 7);
            }
            
            const targetUtcMs = targetGmt2.getTime() - (2 * 3600000);
            return targetUtcMs;
        }

        // Local storage persistence or default
        let targetTimestamp = localStorage.getItem('custom_target_timestamp') 
            ? parseInt(localStorage.getItem('custom_target_timestamp')) 
            : getDefaultSundayTarget();

        let cycleStartTimestamp = targetTimestamp - (7 * 24 * 3600 * 1000);

        function showToast(message) {
            const toast = document.getElementById('toast-box');
            const msgEl = document.getElementById('toast-message');
            msgEl.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        function toggleEditModal(show) {
            const modal = document.getElementById('edit-modal');
            if (show) {
                // Populate current target date in datetime-local format
                const d = new Date(targetTimestamp);
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                const hours = String(d.getHours()).padStart(2, '0');
                const minutes = String(d.getMinutes()).padStart(2, '0');
                document.getElementById('modal-datetime-input').value = `${year}-${month}-${day}T${hours}:${minutes}`;
                
                modal.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                modal.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        function saveNewTarget() {
            const inputVal = document.getElementById('modal-datetime-input').value;
            if (!inputVal) return;
            const newDate = new Date(inputVal);
            targetTimestamp = newDate.getTime();
            cycleStartTimestamp = Date.now(); // reset cycle start for progress bar calculation
            localStorage.setItem('custom_target_timestamp', targetTimestamp);
            toggleEditModal(false);
            showToast('Target deadline updated successfully');
        }

        function resetToDefaultSunday() {
            targetTimestamp = getDefaultSundayTarget();
            cycleStartTimestamp = targetTimestamp - (7 * 24 * 3600 * 1000);
            localStorage.removeItem('custom_target_timestamp');
            showToast('Reset to upcoming Sunday 22:00 GMT+2');
        }

        function copyCountdownStatus() {
            const days = document.getElementById('days').innerText;
            const hours = document.getElementById('hours').innerText;
            const mins = document.getElementById('minutes').innerText;
            const secs = document.getElementById('seconds').innerText;
            const statusText = `Countdown: ${days}d ${hours}h ${mins}m ${secs}s remaining.`;
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(statusText);
            } else {
                const el = document.createElement('textarea');
                el.value = statusText;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
            }
            showToast('Status copied to clipboard');
        }

        function updateCountdown() {
            const now = Date.now();
            const distance = targetTimestamp - now;

            // Display current local time clock
            const currentLocalDate = new Date();
            document.getElementById('current-clock').innerText = `LOCAL ${currentLocalDate.toLocaleTimeString()}`;

            // Display formatted target date string
            const targetDateObj = new Date(targetTimestamp);
            document.getElementById('target-date-string').innerText = targetDateObj.toLocaleString();

            if (distance <= 0) {
                document.getElementById('days').innerText = "00";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                document.getElementById('progress-bar-fill').style.width = "100%";
                document.getElementById('progress-percent').innerText = "100.00%";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');

            const totalCycleSpan = targetTimestamp - cycleStartTimestamp;
            const elapsedSpan = now - cycleStartTimestamp;
            let progressPercent = totalCycleSpan > 0 ? (elapsedSpan / totalCycleSpan) * 100 : 100;
            if (progressPercent > 100) progressPercent = 100;
            if (progressPercent < 0) progressPercent = 0;

            document.getElementById('progress-bar-fill').style.width = progressPercent.toFixed(2) + '%';
            document.getElementById('progress-percent').innerText = progressPercent.toFixed(2) + '%';

            requestAnimationFrame(updateCountdown);
        }

        window.onload = function() {
            requestAnimationFrame(updateCountdown);
        };
    </script>
</body>
</html>
